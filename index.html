<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f1e8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1914" media="(prefers-color-scheme: dark)">
  <title>Munchkin Stärke-Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚔️</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <noscript><p style="padding:2rem;text-align:center">Dieses Tool braucht JavaScript.</p></noscript>
  <main id="app" aria-live="polite"></main>
  <script>
    // Fallback gegen Blackscreens: Scheitert schon das Laden der Module
    // (Syntaxfehler, kaputter Cache, Netzwerk), läuft app.js nie — dann
    // nach 4s eine verständliche Fehlerkarte statt einer leeren Seite zeigen.
    window.addEventListener("error", function (e) { window.__loadError = window.__loadError || e.message; }, true);
    setTimeout(function () {
      var app = document.getElementById("app");
      if (app && !app.firstElementChild) {
        app.innerHTML =
          '<div class="screen screen-start"><header class="start-head">' +
          '<div class="logo">⚠️</div><h1>Hoppla</h1>' +
          '<p class="tagline">Die App konnte nicht geladen werden.</p></header>' +
          '<p class="error-detail"></p>' +
          '<button class="btn btn-primary" onclick="location.reload()">Neu laden</button></div>';
        app.querySelector(".error-detail").textContent =
          window.__loadError || "Unbekannter Ladefehler — möglicherweise ein alter Stand im Cache.";
      }
    }, 4000);
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
